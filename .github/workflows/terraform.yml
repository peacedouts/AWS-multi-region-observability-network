name: terraform-checks

# Static checks only. They need no AWS access, so they run on every push and PR.
# The deployment pipeline (plan/apply across accounts) is designed in
# docs/deployment.md, section 3; it isn't wired up here because the AWS
# accounts in network-plan.yaml are placeholders.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TF_VERSION: "1.10.5"

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "${{ env.TF_VERSION }}" }
      - run: make validate
      - run: make test
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init && tflint --recursive
        env:
          # tflint --init downloads its AWS rules from GitHub; unauthenticated
          # requests from shared runners hit GitHub's rate limit.
          GITHUB_TOKEN: ${{ github.token }}
